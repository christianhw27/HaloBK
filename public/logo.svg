  <circle cx="80.5" cy="79" r="2.5" fill="#fef08a"/>

  <!-- Badge Text BK SMADA -->
  <rect x="22" y="86" width="84" height="22" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="64" y="101" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">BK SMADA</text>
</svg>

